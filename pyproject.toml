[project]
name = "refactoring-to-clean-architecture"
version = "0.1.0"
description = "Refactoring to Clean Architecture with Python."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.7.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.poe.tasks]
test = "python -m pytest steps"
test-cov = "python -m pytest steps --cov-report=html"
fmt-ruff = "ruff format"
fmt-ruff-check = "ruff check --fix"
fmt = ["fmt-ruff", "fmt-ruff-check"]
lint-ruff = "ruff check"
lint-ty = "ty check"
lint = ["lint-ruff", "lint-ty"]
check = ["lint", "test"]

[tool.poe.tasks.test-step]
cmd = "python -m pytest"
help = "Run tests for a specific step (e.g., poe test-step steps/step0_monolith/tests)"

[[tool.poe.tasks.test-step.args]]
name = "step_dir"
positional = true
required = true

[tool.ruff]
target-version = "py314"
line-length = 79
src = ["steps"]

[tool.ruff.lint]
select = ["ALL"]
unfixable = [
    "F401",
    "F841",
]
ignore = [
    "TD",
    "FIX",
    "FBT",
    "COM",
    "PL",
    "FLY",
    "ISC001",
    "CPY001",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "D104",
]
"tests/**/*.py" = [
    "S101",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "ARG",
]
"steps/**/tests/**/*.py" = [
    "S101",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "ARG",
]

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
source = ["steps"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["steps"]
addopts = [
    "-s",
    "-vv",
    "--cov=steps",
    "--cov-branch",
    "--cov-report=term-missing",
]
env = [
    "TZ = Asia/Tokyo",
]
