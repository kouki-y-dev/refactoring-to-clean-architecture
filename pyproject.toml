[project]
name = "refactoring-to-clean-architecture"
version = "0.1.0"
description = "Refactoring to Clean Architecture with Python."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.7.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.poe.tasks]
fmt-ruff-format = "ruff format"
fmt-ruff-check = "ruff check --fix"
fmt = ["fmt-ruff-format", "fmt-ruff-check"]

lint-ruff = "ruff check"
lint-ty = [
    "lint-ty-step0",
    "lint-ty-step1",
    "lint-ty-step2",
    "lint-ty-step3",
    "lint-ty-step4",
    "lint-ty-step5",
]
lint = ["lint-ruff", "lint-ty"]

test-step0 = "pytest steps/step0_monolith/tests"
test-step1 = "pytest steps/step1_separate_layers/tests"
test-step2 = "pytest steps/step2_domain_model/tests"
test-step3 = "pytest steps/step3_repository/tests"
test-step4 = "pytest steps/step4_usecase/tests"
test-step5 = "pytest steps/step5_dependency_inversion/tests"
test = ["test-step0", "test-step1", "test-step2", "test-step3", "test-step4", "test-step5"]

check = ["lint", "test"]

[tool.poe.tasks.lint-ty-step0]
cmd = "ty check steps/step0_monolith"
env = { PYTHONPATH = "steps/step0_monolith/src" }

[tool.poe.tasks.lint-ty-step1]
cmd = "ty check steps/step1_separate_layers"
env = { PYTHONPATH = "steps/step1_separate_layers/src" }

[tool.poe.tasks.lint-ty-step2]
cmd = "ty check steps/step2_domain_model"
env = { PYTHONPATH = "steps/step2_domain_model/src" }

[tool.poe.tasks.lint-ty-step3]
cmd = "ty check steps/step3_repository"
env = { PYTHONPATH = "steps/step3_repository/src" }

[tool.poe.tasks.lint-ty-step4]
cmd = "ty check steps/step4_usecase"
env = { PYTHONPATH = "steps/step4_usecase/src" }

[tool.poe.tasks.lint-ty-step5]
cmd = "ty check steps/step5_dependency_inversion"
env = { PYTHONPATH = "steps/step5_dependency_inversion/src" }

[tool.poe.tasks.test-step]
cmd = "pytest"
help = "Run tests for a specific step"

[[tool.poe.tasks.test-step.args]]
name = "step_dir"
positional = true
required = true

[tool.ty.rules]
# 本リポジトリは各ステップ（steps/step*）ごとに独立したモジュール構造（同名の service.py や data_access.py の共存）を持っています。
# プロジェクトルートからエディタ（VS Code等）を開いた際に発生する未解決インポートのエラー表示を抑制するため、
# ルートレベルでは unresolved-import を ignore に設定しています。
# 各ステップごとの厳密な型チェックは `uv run poe lint-ty`（または `ty check --project steps/stepX_*`）で実行されます。
unresolved-import = "ignore"

[tool.ruff]
target-version = "py314"
line-length = 79
src = ["steps"]

[tool.ruff.lint]
select = ["ALL"]
unfixable = [
    "F401",
    "F841",
]
ignore = [
    "TD",
    "FIX",
    "FBT",
    "COM",
    "PL",
    "FLY",
    "ISC001",
    "CPY001",
    "T201",
    "INP001",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "D104",
]
"tests/**/*.py" = [
    "S101",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "ARG",
    "PGH003",
]
"steps/**/tests/**/*.py" = [
    "S101",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "ARG",
    "PGH003",
]

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
source = ["steps"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "-s",
    "-vv",
    "--cov=steps",
    "--cov-branch",
    "--cov-report=term-missing",
]
env = [
    "TZ = Asia/Tokyo",
]
